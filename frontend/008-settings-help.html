<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <title>Make Again · 008 设置与帮助</title>
  <link rel="stylesheet" href="assets/make-again-shared.css" />
  <link rel="stylesheet" href="assets/make-again-pages.css" />
  <link rel="stylesheet" href="assets/utility-pages.css" />
</head>
<body>
  <main class="ma-standalone-shell">
    <nav class="ma-standalone-nav" aria-label="Make Again 页面导航"><span class="ma-standalone-nav-title">008 · 设置与帮助</span><span class="ma-standalone-nav-actions"><a href="index.html" target="_top">总入口</a><a href="005-home.html?menu=open">回到菜单</a></span></nav>
    <div id="make-again-founder-letter-wireframe" data-mode="atmosphere" data-utility-page="settings" role="region" aria-label="Make Again 设置与帮助界面">
      <div class="ma-letter-review-tools"><span class="ma-letter-review-title">008 · 设置与帮助</span><div class="ma-letter-review-actions"><button type="button" class="ma-letter-mode-toggle" aria-pressed="true">切换至结构线框</button></div></div>
      <div class="ma-letter-preview-stage">
        <div class="ma-letter-phone ma-utility-phone" data-transition-state="utility" aria-label="设置与帮助手机界面">
          <section class="ma-utility-screen">
            <header class="ma-utility-header"><button type="button" class="ma-utility-back" data-utility-back>返回菜单</button><h1>设置与帮助</h1><span class="ma-utility-capsule-safe" aria-hidden="true"></span></header>
            <div class="ma-utility-content">
              <div class="ma-utility-intro"><span>MAKE AGAIN · PREFERENCES</span><h2>让陪伴更像你需要的样子</h2><p>这些设置只影响表达方式，不改变你已经留下的内容。</p></div>
              <div class="ma-settings-list">
                <div class="ma-setting-item"><div><strong>语音输入</strong><br /><small>允许长按 Voice 球说话</small></div><button type="button" class="ma-setting-toggle" data-setting-toggle aria-label="语音输入" aria-pressed="true"></button></div>
                <div class="ma-setting-item"><div><strong>回应提醒</strong><br /><small>AI 回应完成时轻轻提醒</small></div><button type="button" class="ma-setting-toggle" data-setting-toggle aria-label="回应提醒" aria-pressed="true"></button></div>
                <div class="ma-setting-item"><div><strong>保存对话摘要</strong><br /><small>完整原音频不会长期保存</small></div><button type="button" class="ma-setting-toggle" data-setting-toggle aria-label="保存对话摘要" aria-pressed="true"></button></div>
              </div>
              <p class="ma-help-title">常见问题</p>
              <div class="ma-settings-list">
                <button type="button" class="ma-help-item" data-help-item aria-expanded="false"><strong>如何使用主页 Voice 球？</strong><p>长按开始录音，松开即发送。短按不会误触进入聊天室；轻触模块的其他区域才会打开完整聊天。</p></button>
                <button type="button" class="ma-help-item" data-help-item aria-expanded="false"><strong>如何删除一段聊天记录？</strong><p>正式版本会在聊天历史详情中提供删除入口，并在不可恢复前再次确认。</p></button>
                <button type="button" class="ma-help-item" data-help-item aria-expanded="false"><strong>需要紧急帮助时怎么办？</strong><p>Make Again 不能替代专业的医疗或危机支持。请优先联系身边可信任的人或当地紧急援助服务。</p></button>
              </div>
            </div>
          </section>
        </div>
      </div>
      <p class="ma-letter-review-status" aria-live="polite">008 · 设置项与帮助问答均可交互</p>
    </div>
    <p class="ma-standalone-flow-note">返回时恢复主页菜单展开状态。</p>
  </main>
  <script src="assets/make-again-shared.js" defer></script><script src="assets/utility-pages.js" defer></script>
</body>
</html>
