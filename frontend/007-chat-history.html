<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <title>Make Again · 007 聊天历史</title>
  <link rel="stylesheet" href="assets/make-again-shared.css" />
  <link rel="stylesheet" href="assets/make-again-pages.css" />
  <link rel="stylesheet" href="assets/utility-pages.css" />
  <link rel="stylesheet" href="assets/utility-v6.css" />
  <link rel="stylesheet" href="assets/007-chat-history.css?v=2.1" />
</head>
<body>
  <main class="ma-standalone-shell">
    <nav class="ma-standalone-nav" aria-label="Make Again 页面导航">
      <span class="ma-standalone-nav-title">007 · 聊天历史</span>
      <span class="ma-standalone-nav-actions"><a href="index.html">总入口</a></span>
    </nav>
    <div id="make-again-founder-letter-wireframe" data-mode="atmosphere" data-utility-page="history" role="region" aria-label="Make Again 聊天历史界面">
      <div class="ma-letter-review-tools">
        <span class="ma-letter-review-title">007 · 聊天历史 → 当日完整对话</span>
        <div class="ma-letter-review-actions">
          <button type="button" class="ma-letter-mode-toggle" aria-pressed="true">切换至结构线框</button>
        </div>
      </div>
      <div class="ma-letter-preview-stage">
        <div class="ma-letter-phone ma-utility-phone">
          <section class="ma-utility-screen ma-history-screen">
            <header class="ma-utility-header">
              <button type="button" class="ma-utility-back" data-home-back aria-label="返回首页">←</button>
              <h1>聊天历史</h1>
              <span class="ma-utility-capsule-safe" aria-hidden="true"></span>
            </header>

            <div class="ma-utility-content ma-history-content">
              <section class="ma-history-month" aria-label="选择月份">
                <button type="button" data-month-previous aria-label="查看上一个月">上个月</button>
                <div><strong data-month-title>2026 年 8 月</strong><small data-month-count>3 天留下了对话</small></div>
                <button type="button" data-month-next aria-label="查看下一个月" disabled>下个月</button>
              </section>

              <section class="ma-history-empty" data-history-empty hidden aria-live="polite">
                <span class="ma-history-empty-mark" aria-hidden="true"><i></i><i></i><i></i></span>
                <h2>还没有留下对话</h2>
                <p>等你和 Wakey 说过一些话，它们会按日期出现在这里。</p>
                <button type="button" data-empty-chat>去和 Wakey 说说话</button>
              </section>

              <div class="ma-history-list ma-daily-list" data-history-list aria-live="polite"></div>
            </div>
          </section>
        </div>
      </div>
      <p class="ma-letter-review-status" aria-live="polite">007 · 按月份查看聊天历史，点击日期进入完整对话</p>
    </div>
  </main>
  <script src="assets/api.js" defer></script>
  <script src="assets/make-again-state-v3.js?v=3.1" defer></script>
  <script src="assets/make-again-shared.js" defer></script>
  <script src="assets/007-chat-history.js?v=2.0" defer></script>
</body>
</html>
