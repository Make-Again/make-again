<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <title>Make Again · 关于</title>
  <link rel="stylesheet" href="assets/make-again-shared.css" />
  <link rel="stylesheet" href="assets/make-again-pages.css" />
  <link rel="stylesheet" href="assets/utility-pages.css" />
  <link rel="stylesheet" href="assets/utility-v6.css" />
  <link rel="stylesheet" href="assets/settings-v8.css?v=1.0" />
  <link rel="stylesheet" href="assets/about-v2.css?v=2.0" />
</head>
<body>
  <main class="ma-standalone-shell">
    <div id="make-again-founder-letter-wireframe" data-mode="atmosphere" class="ma-settings-family-v8" role="region" aria-label="关于 Make Again 界面">
      <div class="ma-letter-review-tools"><span class="ma-letter-review-title">014 · 关于 Make Again</span><div class="ma-letter-review-actions"><button type="button" class="ma-letter-mode-toggle" aria-pressed="true">切换至结构线框</button></div></div>
      <div class="ma-letter-preview-stage">
        <div class="ma-letter-phone ma-utility-phone">
          <section class="ma-utility-screen">
            <header class="ma-utility-header">
              <button type="button" class="ma-utility-back" data-settings-back aria-label="返回设置">←</button>
              <h1>关于 Make Again</h1>
              <span class="ma-utility-capsule-safe" aria-hidden="true"></span>
            </header>
            <div class="ma-utility-content ma-settings-content-v8 ma-about-content-v8">
              <div class="ma-about-mark">M</div>
              <div class="ma-about-copy">
                <h2>我们不是为了<br />让你在这里待得更久</h2>
                <p>我们想陪你把那些说不清的东西看见、收好，然后在某一天不再需要这里。</p>
                <small>Make Again · 版本 0.6</small>
              </div>
              <div class="ma-settings-list ma-about-links-v8">
                <button type="button" class="ma-setting-link" data-about-document="agreement"><span>用户协议</span><b aria-hidden="true">›</b></button>
                <button type="button" class="ma-setting-link" data-about-document="privacy"><span>隐私与数据说明</span><b aria-hidden="true">›</b></button>
                <button type="button" class="ma-setting-link" data-about-document="ai"><span>AI 生成内容说明</span><b aria-hidden="true">›</b></button>
              </div>
            </div>
            <div class="ma-about-sheet-layer" data-about-sheet aria-hidden="true">
              <button type="button" class="ma-about-sheet-backdrop" data-about-close aria-label="关闭说明"></button>
              <section class="ma-about-sheet" role="dialog" aria-modal="true" aria-labelledby="ma-about-sheet-title" tabindex="-1">
                <header>
                  <span aria-hidden="true"></span>
                  <h2 id="ma-about-sheet-title" data-about-title></h2>
                  <button type="button" data-about-close aria-label="关闭">×</button>
                </header>
                <div class="ma-about-sheet-body" data-about-body></div>
                <p class="ma-about-sheet-draft">产品审核占位稿 · 非最终法律文本</p>
              </section>
            </div>
          </section>
        </div>
      </div>
      <p class="ma-letter-review-status" aria-live="polite">014 · 关于 Make Again 与必要说明</p>
    </div>
  </main>
  <script src="assets/make-again-shared.js" defer></script>
  <script src="assets/utility-v6.js?v=6.2" defer></script>
  <script src="assets/about-v2.js?v=2.0" defer></script>
</body>
</html>
