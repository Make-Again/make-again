<body>
  <main class="ma-standalone-shell">
    <nav class="ma-standalone-nav"><span class="ma-standalone-nav-title">021 · 纪念品商城</span><span class="ma-standalone-nav-actions"><a href="index.html">总入口</a><a href="021-keepsake-shop.html?path=breakup">分手</a><a href="021-keepsake-shop.html?path=pet">宠物</a><a href="021-keepsake-shop.html?path=relative">亲人</a></span></nav>
    <div id="make-again-founder-letter-wireframe" data-mode="atmosphere" data-ending-page="shop">
      <div class="ma-letter-review-tools"><span class="ma-letter-review-title">021 · 可以不购买，不制造情绪压力</span><div class="ma-letter-review-actions"><button type="button" class="ma-letter-mode-toggle" aria-pressed="true">切换至结构线框</button></div></div>
      <div class="ma-letter-preview-stage">
        <div class="ma-letter-phone ma-ending-phone">
          <section class="ma-ending-screen">
            <header class="ma-ending-header"><button type="button" data-go="018-archive-bag.html" data-keep-path="true" aria-label="返回只读档案">←</button><div><h1>给记忆一个形状</h1><small>完全可以不购买</small></div><span class="ma-ending-safe"></span></header>
            <div class="ma-ending-body">
              <div class="ma-shop-intro"><h2>如果你愿意，<br />可以把一些记忆带回现实</h2><p>这些不是“走出来”的证明，也不是必须完成的步骤。只是在你需要时，把档案里的文字和物件做成可以触摸的东西。</p></div>
              <div class="ma-shop-grid">
                <button type="button" class="ma-shop-card" data-shop-item="纪念书" aria-pressed="false"><span class="ma-shop-art">书</span><strong>纪念书</strong><small>把文字、便利贴与照片按时间装订</small><b>设计预览</b></button>
                <button type="button" class="ma-shop-card" data-shop-item="留白日记" aria-pressed="false"><span class="ma-shop-art">记</span><strong>留白日记</strong><small>印下已保存的故事，也为以后留下空白</small><b>设计预览</b></button>
                <button type="button" class="ma-shop-card" data-shop-item="记忆玻璃瓶" aria-pressed="false"><span class="ma-shop-art">光</span><strong>记忆玻璃瓶</strong><small>把物件轮廓与颜色转成抽象摆件</small><b>设计预览</b></button>
              </div>
              <p class="ma-shop-status" data-shop-status>先看看就好，现在不需要做决定</p>
              <button type="button" class="ma-ending-primary" data-go="018-archive-bag.html" data-keep-path="true">返回只读档案</button>
            </div>
          </section>
        </div>
      </div>
      <p class="ma-letter-review-status">021 · 周边是可选纪念物，不与疗愈结果绑定</p>
