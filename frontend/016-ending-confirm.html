<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Make Again · 结束确认</title>
  <link rel="stylesheet" href="assets/make-again-shared.css" />
  <link rel="stylesheet" href="assets/make-again-pages.css" />
  <link rel="stylesheet" href="assets/ending-v1.css?v=1.5" />
</head>
<body>
  <main class="ma-standalone-shell">
    <nav class="ma-standalone-nav" aria-label="Make Again 页面导航"><span class="ma-standalone-nav-title">016 · 结束确认</span><span class="ma-standalone-nav-actions"><a href="index.html">总入口</a><a href="016-ending-confirm.html?path=breakup">分手路径</a><a href="016-ending-confirm.html?path=pet">宠物路径</a><a href="016-ending-confirm.html?path=relative">亲人路径</a></span></nav>
    <div id="make-again-founder-letter-wireframe" data-mode="atmosphere" data-ending-page="confirm">
      <div class="ma-letter-review-tools"><span class="ma-letter-review-title">016 · 二次确认 / 长按归档</span><div class="ma-letter-review-actions"><button type="button" class="ma-letter-mode-toggle" aria-pressed="true">切换至结构线框</button></div></div>
      <div class="ma-letter-preview-stage">
        <div class="ma-letter-phone ma-ending-phone">
          <section class="ma-ending-screen">
            <header class="ma-ending-header"><span aria-hidden="true"></span><div><h1>结束这段陪伴</h1><small>确认前仍然可以取消</small></div><span class="ma-ending-safe"></span></header>
            <div class="ma-ending-body">
              <div class="ma-end-seal" aria-hidden="true"><span>归</span></div>
              <p class="ma-ending-kicker">MAKE AGAIN · A QUIET ENDING</p>
              <h2 class="ma-ending-title">你真的准备好，<br />把这一段收起来了吗</h2>
              <p class="ma-ending-copy">结束不是删除，也不是要求你忘记。我们会把这里留下的文字、物件与照片整理成一个只读档案，以后仍然可以回来看看。</p>
              <div class="ma-end-assurance"><strong>归档之后</strong><span>旧记录仍然保存 · 不再继续修改 · 不会自动删除</span></div>
              <div class="ma-ending-actions"><button type="button" class="ma-ending-primary" data-end-open-confirm>结束这段陪伴</button><button type="button" class="ma-ending-secondary" data-go="005-home.html?from=ending">我还想再待一会</button></div>
              <button type="button" class="ma-ending-tertiary" data-go="024-reply-compose.html?from=ending">回信他人 · 把走过的路留给仍在路上的人</button>
            </div>
            <div class="ma-end-confirm-layer" data-end-confirm-layer aria-hidden="true">
              <article class="ma-end-confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="ma-end-confirm-title" aria-describedby="ma-end-confirm-copy ma-end-hold-status">
                <h2 id="ma-end-confirm-title">最后确认一次</h2>
                <p id="ma-end-confirm-copy">长按两秒开始整理。松手会立即取消；完成全部告别流程后，内容才会进入只读档案。</p>
                <button type="button" class="ma-hold-confirm" data-hold-confirm data-holding="false"><span>长按两秒 · 开始整理</span></button>
                <p class="ma-hold-status" id="ma-end-hold-status" data-hold-status aria-live="polite">按住后开始计时</p>
                <button type="button" class="ma-end-accessible-confirm" data-end-accessible-confirm aria-pressed="false">无法长按？改用点按确认</button>
                <button type="button" class="ma-end-confirm-cancel" data-end-close-confirm>取消</button>
              </article>
            </div>
          </section>
        </div>
      </div>
      <p class="ma-letter-review-status">016 · 长按只开始整理，完成全部流程后才进入只读档案</p>
    </div>
  </main>
  <script src="assets/api.js" defer></script>
  <script src="assets/make-again-state-v3.js?v=3.1" defer></script>
  <script src="assets/make-again-shared.js" defer></script>
  <script src="assets/ending-v1.js?v=1.6" defer></script>
</body>
</html>
