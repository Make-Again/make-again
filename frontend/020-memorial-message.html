<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Make Again · 纪念信息</title>
  <link rel="stylesheet" href="assets/make-again-shared.css" />
  <link rel="stylesheet" href="assets/make-again-pages.css" />
  <link rel="stylesheet" href="assets/ending-v1.css?v=1.5" />
</head>
<body>
  <main class="ma-standalone-shell">
    <nav class="ma-standalone-nav"><span class="ma-standalone-nav-title">020 · 亲人 / 宠物路径</span><span class="ma-standalone-nav-actions"><a href="index.html">总入口</a><a href="020-memorial-message.html?path=pet">宠物</a><a href="020-memorial-message.html?path=relative">亲人</a></span></nav>
    <div id="make-again-founder-letter-wireframe" data-mode="atmosphere" data-ending-page="message">
      <div class="ma-letter-review-tools"><span class="ma-letter-review-title">020 · Apple 信息式总结 / 明确 AI 来源</span><div class="ma-letter-review-actions"><button type="button" class="ma-letter-mode-toggle" aria-pressed="true">切换至结构线框</button></div></div>
      <div class="ma-letter-preview-stage">
        <div class="ma-letter-phone ma-ending-phone">
          <section class="ma-ending-screen ma-message-screen">
            <header class="ma-ending-header"><span aria-hidden="true"></span><div><h1 data-memorial-title>陪伴回信</h1><small>所有内容都会保存</small></div><span class="ma-ending-safe"></span></header>
            <div class="ma-message-profile" data-memorial-profile-block><span data-memorial-profile>伴</span><strong data-memorial-contact>它</strong><small data-memorial-source>AI 整理 · 非真实消息</small></div>
            <div class="ma-message-thread" data-message-thread>
              <p class="ma-message-time">今天 09:41</p>
              <p class="ma-message-disclosure" data-memorial-disclosure>以下文字由 AI 根据你留下的故事整理，不是真实对象发来的信息。</p>
              <p class="ma-message-bubble" data-memorial-message></p>
              <div class="ma-message-actions">
                <button type="button" class="ma-message-continue" data-memorial-continue>收好这句话，继续</button>
                <button type="button" class="ma-message-skip" data-farewell-skip>跳过，直接收好</button>
              </div>
            </div>
            <div class="ma-farewell-panel ma-burial-ritual" data-burial-ritual data-ritual-state="idle" hidden>
              <p class="ma-ending-kicker">MAKE AGAIN · MEMORY GARDEN</p>
              <h2 data-burial-title>把这些陪伴，<br />放进一个安静的地方</h2>
              <p class="ma-farewell-copy" data-burial-copy>照片、文字和物品会被收进纪念袋。它们不会消失，仍然可以在只读档案里重新打开。</p>
              <div class="ma-burial-scene" aria-hidden="true">
                <div class="ma-burial-keepsakes"><span class="ma-burial-letter"></span><span class="ma-burial-photo"></span><span class="ma-burial-object"></span></div>
                <div class="ma-memory-bag"><span></span><i></i></div>
                <div class="ma-memory-soil"><span></span></div>
                <div class="ma-memory-marker"><i></i><span></span></div>
              </div>
              <p class="ma-ritual-status" data-burial-status aria-live="polite">准备好时，再把它们轻轻收好</p>
              <div class="ma-farewell-actions">
                <button type="button" class="ma-ending-primary" data-burial-start>收进纪念袋</button>
                <button type="button" class="ma-ending-secondary" data-farewell-skip>跳过仪式，直接收好</button>
              </div>
            </div>
          </section>
        </div>
      </div>
      <p class="ma-letter-review-status">020 · 不冒充离开的亲人或宠物，来源在信息前明确说明</p>
    </div>
  </main>
  <script src="assets/api.js" defer></script>
  <script src="assets/make-again-state-v3.js?v=3.1" defer></script>
  <script src="assets/make-again-shared.js" defer></script>
  <script src="assets/ending-v1.js?v=1.6" defer></script>
</body>
</html>
