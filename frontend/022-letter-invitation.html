<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <title>Make Again · 收到一封回信</title>
  <link rel="stylesheet" href="assets/make-again-shared.css" />
  <link rel="stylesheet" href="assets/make-again-pages.css" />
  <link rel="stylesheet" href="assets/ending-v1.css?v=1.3" />
  <link rel="stylesheet" href="assets/022-reply-v2.css?v=2.0" />
</head>
<body>
  <main class="ma-standalone-shell">
    <nav class="ma-standalone-nav"><span class="ma-standalone-nav-title">022 · 收到匿名回信</span><span class="ma-standalone-nav-actions"><a href="index.html">总入口</a></span></nav>
    <div id="make-again-founder-letter-wireframe" data-mode="atmosphere" data-reply-page>
      <div class="ma-letter-review-tools"><span class="ma-letter-review-title">022 · 自动展开回信 → 读完 → 钉入时间看板</span></div>
      <div class="ma-letter-preview-stage">
        <div class="ma-letter-phone ma-ending-phone" data-reply-state="opening">
          <section class="ma-ending-screen ma-reply-screen">
            <header class="ma-ending-header ma-reply-header">
              <span aria-hidden="true"></span>
              <div><h1>一封给你的回信</h1><small>树洞信箱 · 匿名</small></div>
              <span class="ma-ending-safe" aria-hidden="true"></span>
            </header>
            <div class="ma-ending-body ma-reply-body">
              <article class="ma-reply-letter" data-reply-letter aria-labelledby="ma-reply-title">
                <header><span>REPLY · 001</span><time>今天</time></header>
                <small>写给曾经把路留给我的你</small>
                <h2 id="ma-reply-title">你的那句话，<br />我在最难熬的晚上读到了</h2>
                <div class="ma-reply-copy" data-reply-copy>
                  <p>你写“先照顾今天的自己，也算是在往前走”。那天晚上，我第一次没有逼自己立刻想明白所有事情。</p>
                  <p>我去吃了一点东西，也终于睡了几个小时。问题并没有马上消失，但我知道自己可以先活过今天。</p>
                  <p>谢谢你把真正走过的那一部分留给我。它没有替我做决定，却让我觉得这条路上不是只有我一个人。</p>
                </div>
                <footer>来自一个仍在路上的人</footer>
              </article>
              <div class="ma-reply-actions">
                <button type="button" class="ma-ending-primary ma-reply-pin" data-reply-pin>我读完了，钉到时间看板</button>
                <button type="button" class="ma-ending-secondary ma-reply-later" data-reply-later>暂时离开，稍后阅读</button>
              </div>
            </div>
          </section>
        </div>
      </div>
      <p class="ma-letter-review-status" aria-live="polite">022 · 回信自动展开 · 可暂时离开并保留未读入口</p>
    </div>
  </main>
  <script src="assets/api.js" defer></script>
  <script src="assets/make-again-state-v3.js?v=3.1" defer></script>
  <script src="assets/make-again-shared.js" defer></script>
  <script src="assets/022-reply-v2.js?v=2.2" defer></script>
</body>
</html>
